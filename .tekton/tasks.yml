---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      script: |
        #!/bin/sh
        echo "=== Cleaning workspace ==="
        rm -rf $(workspaces.source.path)/*
        rm -rf $(workspaces.source.path)/.[!.]*
        echo "=== Cleanup complete ==="
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: test
spec:
  workspaces:
    - name: source
  steps:
    - name: jest-test
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "=== Installing dependencies ==="
        npm install
        echo "=== Running Jest unit tests ==="
        npm test
        echo "=== Tests complete ==="